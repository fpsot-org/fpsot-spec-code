# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
# France sets rules on publishing source code and on licenses, not on coding style. The ANSSI
# guides cover Rust and C, which FPSOT does not use; they serve as a model of structure only.
# This file is informational and not legal advice.
code: FR
name: {en: France, fr: France}
rows:
  - id: COD-002
    text: {en: "Source code is an administrative document that administrations publish, at one of four levels of openness. The guidance sets no coding style.", fr: "Le code source est un document administratif que les administrations publient, selon l’un de quatre niveaux d’ouverture. La documentation ne fixe aucun style de code."}
    status: not-covered
    source: {title: "code.gouv.fr, Documentation", url: "https://code.gouv.fr/documentation/", archive: "https://web.archive.org/web/20260310065745/https://code.gouv.fr/documentation/"}
    last_checked: "2026-11-17"
  - id: COD-003
    text: {en: "The ANSSI guide for Rust makes the use of a linter a rule and the use of the formatter a recommendation.", fr: "Le guide de l’ANSSI pour Rust fait de l’emploi d’un analyseur statique une règle, et de l’emploi de l’outil de mise en forme une recommandation."}
    status: looser
    source: {title: "ANSSI, Règles de programmation pour le développement d’applications sécurisées en Rust", url: "https://anssi-fr.github.io/rust-guide/", archive: "https://web.archive.org/web/20261011184922/https://anssi-fr.github.io/rust-guide/"}
    last_checked: "2026-11-17"
  - id: COD-014
    text: {en: "Administrations choose the license of their code from a closed list, named by SPDX identifiers, which includes Apache-2.0. The list asks for no header in each file.", fr: "Les administrations choisissent la licence de leur code dans une liste fermée, désignée par identifiants SPDX, qui comprend Apache-2.0. La liste ne demande aucun en-tête dans chaque fichier."}
    status: looser
    source: {title: "data.gouv.fr, Licences de réutilisation (article D323-2-1 of the CRPA)", url: "https://www.data.gouv.fr/pages/legal/licences", archive: "https://web.archive.org/web/20260908085622/https://www.data.gouv.fr/pages/legal/licences"}
    last_checked: "2026-11-17"
