# SPDX-License-Identifier: Apache-2.0
# Setup note for COD-800 to COD-805: copy this file to .github/workflows/ and the file
# zizmor.yml to the repository root, then make both jobs required checks of the protected
# branches. The jobs run on every pull request, so a required check never waits on a skipped job.
name: workflow-lint
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      # go run checks the module against the Go checksum database.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          config: zizmor.yml
          advanced-security: "false"
